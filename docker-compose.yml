services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DOCUDIFF_LLM_PROVIDER=deterministic
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_storage:

